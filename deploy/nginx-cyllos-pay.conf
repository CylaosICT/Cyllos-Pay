# Vhost nginx de cyllos-pay. `__DOMAIN__` est remplacé par install.sh.
# Certbot ajoutera le bloc HTTPS et la redirection (certbot --nginx -d __DOMAIN__).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/cyllos-pay/public;
    index index.php;

    server_tokens off;
    # Le site ne reçoit que de petits formulaires.
    client_max_body_size 16k;

    access_log /var/log/nginx/cyllos-pay.access.log;
    error_log  /var/log/nginx/cyllos-pay.error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul le front controller est exécuté.
    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-cyllos-pay.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_read_timeout 30s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Pas de fichiers cachés (.env, .git...), sauf la validation Let's Encrypt.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
