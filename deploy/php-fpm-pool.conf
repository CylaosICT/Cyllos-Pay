; Pool PHP-FPM dédié à cyllos-pay (installé par install.sh dans /etc/php/8.4/fpm/pool.d/).
[cyllos-pay]
user = cyllospay
group = cyllospay
listen = /run/php/php8.4-fpm-cyllos-pay.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no

; Le site n'a besoin de rien en dehors de son dossier et de /tmp.
php_admin_value[open_basedir] = /var/www/cyllos-pay:/tmp
php_admin_value[expose_php] = Off
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
